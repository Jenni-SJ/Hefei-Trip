function renderMessageCards(){let items=loadMessages().sort((a,b)=>String(b.time).localeCompare(String(a.time)));main.innerHTML=`<div class="message-addbar"><button type="button" id="addMessageBtn" class="add-message-btn" aria-label="新增时光留言" title="新增留言">＋</button></div><section id="messageList" aria-live="polite">${items.length?items.map(m=>`<article class="result message-card"><div class="message-head"><span class="message-type">${typeIcon(m.type)} ${esc(m.type)}</span><span class="message-type">${esc(m.to||'天才')}留言</span><div class="message-actions"><button type="button" class="icon-btn edit-message" data-id="${esc(m.id)}" aria-label="编辑${esc(m.title)}" title="编辑">✎</button><button type="button" class="icon-btn delete-message" data-id="${esc(m.id)}" aria-label="删除${esc(m.title)}" title="删除">⌫</button></div></div><h3 class="message-title">${esc(m.title)}</h3><div class="message-body">${esc(m.content)}</div><div class="message-time">${esc(formatTime(m.time))}</div><div class="identity-pick"><label>互动身份</label><select class="social-identity" data-id="${esc(m.id)}"><option>男老大</option><option>女老大</option><option>天才</option></select></div><div class="social-row"><button type="button" class="social-btn like-message" data-id="${esc(m.id)}" aria-label="点赞${esc(m.title)}">♥ ${(m.likesBy||[]).length}</button><span class="muted like-detail">${(m.likesBy||[]).length?'点赞：'+(m.likesBy||[]).map(esc).join('、'):'还没有点赞'}</span><button type="button" class="social-btn toggle-comments" data-id="${esc(m.id)}" aria-label="查看留言评论">💬 ${(m.comments||[]).length}</button></div><div class="comment-list" id="comments-${esc(m.id)}" hidden>${(m.comments||[]).map(c=>`<div class="comment-item"><div class="comment-meta"><span class="commenter">${esc(c.by||'访客')}</span> · ${esc(formatTime(c.time))} <button type="button" class="comment-delete" data-mid="${esc(m.id)}" data-cid="${esc(c.id)}" aria-label="删除评论">⌫</button></div><div class="comment-text">${esc(c.text)}</div></div>`).join('')}<form class= function openMessageEditor(id){editingMessageId=id;let items=loadMessages(),editing=items.find(x=>x.id===id);let wrap=document.createElement('div');wrap.id='messageEditor';wrap.className='message-editor-backdrop';wrap.setAttribute('role','dialog');wrap.setAttribute('aria-modal','true');wrap.innerHTML=`<div class="message-editor"><div class="editor-head"><h2>${editing?'编辑留言':'写下时光留言'}</h2><button type="button" class="close-editor" id="closeEditor" aria-label="关闭">×</button></div><div class="message-io"><button type="button" id="exportMessages" class="secondary">⇩ 导出 Excel</button><button type="button" id="importMessages" class="secondary">⇧ 导入 Excel</button><input id="importFile" class="file-input" type="file" accept=".xls,application/vnd.ms-excel,application/xml,text/xml" aria-label="选择 Excel 留言备份文件"></div><div id="ioStatus" class="io-status" aria-live="polite"></div><form id="messageForm" class="message-form"><div class="field"><label for="mtype">对象类型</label><select id="mtype" required><option>景点</option><option>餐饮</option><option>其他</option></select></div><div class="field"><label for="mto">留言人</label><select id="mto" required><option>男老大</option><option>女老大</option><option>天才</option></select></div><div class="field"><label for="mtime">留言时间</label><input id="mtime" type="datetime-local" required></div><div class="field full"><label for="mtitle">对象名称或标题</label><input id="mtitle" maxlength="60" required></div><div class="field full"><label for="mcontent">留言内容</label><textarea id="mcontent" maxlength="800" required></textarea></div><div class="form-actions"><button type="button" id="cancelEditor" class="secondary">取消</button><button type="submit" class="primary">${editing?'保存修改':'生成留言卡片'}</button></div></form></div>`;document.body.appendChild(wrap);let form=document.querySelector('#messageForm'),type=document.querySelector('#mtype'),to=document.querySelector('#mto'),time=document.querySelector('#mtime'),title=document.querySelector('#mtitle'),content=document.querySelector('#mcontent');if(editing){type.value=editing.type;to.value=editing.to||'天才';time.value=editing.time;title.value=editing.title;content.value=editing.content}else time.value=localDateValue();let close=()=>{wrap.remove();editingMessageId=null};document.querySelector('#closeEditor').onclick=close;document.querySelector('#cancelEditor').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()};bindMessageIO();form.addEventListener('submit',e=>{e.preventDefault();let all=loadMessages(),item={id:editingMessageId||String(Date.now()),type:type.value,to:to.value,time:time.value,title:title.value.trim(),content:content.value.trim(),likesBy:editing&&Array.isArray(editing.likesBy)?editing.likesBy:[],comments:editing&&Array.isArray(editing.comments)?editing.comments:[]};if(!item.title||!item.content||!item.time)return;if(editingMessageId)all=all.map(x=>x.id===editingMessageId?item:x);else all.push(item);saveMessages(all);wrap.remove();editingMessageId=null;renderMessageCards()});title.focus()}
function bindMessageIO(){const ioStatus=document.querySelector('#ioStatus'),importFile=document.querySelector('#importFile');document.querySelector('#exportMessages').onclick=()=>{let rows=loadMessages(),xml=buildExcelXml(rows),blob=new Blob(['\\ufeff'+xml],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='合肥旅行_时光留言_'+new Date().toISOString().slice(0,10)+'.xls';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);ioStatus.textContent='已导出 Excel，共 '+rows.length+' 条。'};document.querySelector('#importMessages').onclick=()=>importFile.click();importFile.onchange=function(){var file=importFile.files&&importFile.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var text=String(reader.result||''),doc=new DOMParser().parseFromString(text,'application/xml'),rows=Array.prototype.slice.call(doc.getElementsByTagNameNS('*','Row')),values=rows.map(function(r){return Array.prototype.slice.call(r.getElementsByTagNameNS('*','Data')).map(function(d){return d.textContent||''})}),headers=values.shift(),idx=function(n){return headers.indexOf(n)};var incoming=values.filter(function(r){return r.some(Boolean)}).map(function(r,k){return{id:String(r[idx('ID')]||Date.now()+'_'+k),type:r[idx('留言类型')]||'其他',to:r[idx('留言人')]||'天才',time:String(r[idx('留言时间')]||'').slice(0,16),title:String(r[idx('标题')]||'').slice(0,60),content:String(r[idx('留言内容')]||'').slice(0,800),likesBy:idx('点赞人')>=0?String(r[idx('点赞人')]||'').split('、').filter(Boolean):[],comments:(()=>{try{return idx('评论JSON')>=0?JSON.parse(r[idx('评论JSON')]||'[]'):[]}catch(e){return []}})()}}).filter(function(x){return x.title&&x.content&&x.time});var current=loadMessages(),map={};current.forEach(function(x){map[x.id]=x});incoming.forEach(function(x){if(map[x.id])x.id=x.id+'_import_'+Date.now();map[x.id]=x});saveMessages(Object.keys(map).map(function(k){return map[k]}));wrapAfterImport()}c

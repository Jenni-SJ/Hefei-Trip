const D={'周三':[['13:30','午饭后出发','住宿地附近'],['13:45','逍遥津公园','1–1.5h'],['15:15','明教寺','0.5–1h · 步行约10分钟'],['16:15','淮河路步行街','闲逛 + 小吃/甜品'],['17:30','晚饭','淮河路就近徽菜或老字号'],['18:40','包公园夜游','打车约10–15分钟 · 外围夜景'],['20:00–20:30','回住宿地','']], '周四':[['09:30','住宿地 → 包公园','打车约10–15分钟'],['09:45','包公园','完整参观约2.5h'],['12:20','午饭','约1h'],['13:40','李鸿章故居','1–1.5h'],['15:20','合柴1972','打车约20–30分钟 · 逛2–2.5h'],['18:10','罍街','晚饭 + 夜逛 + 安徽小吃'],['20:30–21:00','回住宿地','']], '周五':[['09:30','住宿地 → 安徽博物院','地铁约40–50分钟'],['10:20','安徽博物院','2.5–3h'],['13:00','午饭','场馆附近约1h'],['14:10','骆岗公园/园博园','建议打车约25–35分钟'],['17:20','天鹅湖','打车约25–35分钟 · 日落/夜景'],['19:00','天鹅湖商圈晚饭','约1h，可顺带休息'],['21:00–21:30','回住宿地','']], '周六':[['09:30','住宿地 → 城隍庙','步行/打车'],['09:50','城隍庙','约1h'],['11:00','杏花公园','步行约10–20分钟'],['12:00','回住宿地','取行李'],['12:10','住宿地附近午饭','控制约1h'],['13:15','前往合肥站','预留进站时间']]};
const main=document.querySelector('#main');let section='日程',day='全部',foodCat='全部';
const topnav=document.querySelector('#topnav'),subnav=document.querySelector('#subnav');
function buttonRow(items,current,attr,cls='subnav'){return `<nav class="${cls}" aria-label="快速切换">${items.map(x=>`<button type="button" data-${attr}="${x}" class="${x===current?'on':''}">${x}</button>`).join('')}</nav>`}
function renderTop(){topnav.innerHTML=['日程','景点库','美食库','时光留言'].map(x=>`<button type="button" data-section="${x}" class="${x===section?'on':''}">${x}</button>`).join('');topnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.section;renderTop();render()})}
function renderSub(){if(section==='日程'){subnav.innerHTML=buttonRow(['全部','周三','周四','周五','周六'],day,'day')+'<div class="section-note">按星期翻阅旅行手账</div>';subnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{day=b.dataset.day;renderSub();renderSchedule()})}else if(section==='美食库'){subnav.innerHTML=buttonRow(['全部','正餐','特色小吃','点心甜品','饮品','伴手礼'],foodCat,'cat','filters')+'<div class="section-note">按正餐、特色小吃、甜品饮品和伴手礼快速翻找</div>';subnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{foodCat=b.dataset.cat;renderSub();renderFood()})}else if(section==='景点库'){subnav.innerHTML='<div class="section-note">搜索景点，并查看附近景点与美食</div>'}else{subnav.innerHTML='<div class="section-note">把旅途中的此刻写成一张可以回看的卡片</div>'}}
function renderSchedule(){let ds=day==='全部'?Object.keys(D):[day];main.innerHTML=ds.map(d=>`<section class="card day"><h2>${d}</h2>${D[d].map(x=>`<div class="stop"><div class="time">${x[0]}</div><div class="name">${x[1]}</div><div class="muted">${x[2]}</div></div>`).join('')}</section>`).join('')}
function searchShell(title,placeholder){main.innerHTML=`<section class="card tools"><h2>${title}</h2><div class="muted">可搜索名称、片区、菜品或附近地点。</div>${title==='美食库'?'<div class="safe-note">家庭饮食偏好：不吃禽类。推荐内容优先考虑猪肉、牛羊肉、鱼虾海鲜、面点与饮品；到店点餐时建议确认汤底、油脂、馅料及配菜是否含鸡、鸭、鹅等禽类成分。</div>':''}<div style="height:12px"></div><input id="q" aria-label="全局搜索" placeholder="${placeholder}"></section><div id="res" aria-live="polite"></div>`;return [document.querySelector('#q'),document.querySelector('#res')]}
function renderSpots(){let [q,r]=searchShell('景点库','例如：包公园 / 罍街 / 老城');function draw(){let t=q.value.trim().toLowerCase();let a=S.filter(s=>!t||s.join(' ').toLowerCase().includes(t));r.innerHTML=a.map(s=>{let nearby=S.filter(z=>z[0]!==s[0]&&(z[1]===s[1]||z[1].includes('老城')&&s[1].includes('老城'))).slice(0,4).map(z=>z[0]);let food=F.filter(f=>f[4].includes(s[0])||f[1].includes(s[1].replace('核心',''))).slice(0,5).map(f=>f[0]);return `<article class="result"><span class="score">${s[2]}/10</span><h3>${s[0]}</h3><div class="meta">${s[3]} · ${s[1]} · ${s[4]}</div><div>${s[5]}</div><div class="label">附近景点</div><div class="tags">${nearby.join(' · ')||'按当日路线衔接'}</div><div class="label">附近美食</div><div class="tags">${food.join(' · ')||'建议按当前位置筛选'}</div></article>`}).join('')||'<div class="empty">没有匹配结果</div>'}q.addEventListener('input',draw);draw()}
function renderFood(){let [q,r]=searchShell('美食库','例如：鸭油烧饼 / 徽菜 / 罍街');function draw(){let t=q.value.trim().toLowerCase();let a=F.filter(f=>(foodCat==='全部'||f[2]===foodCat)&&(!t||f.join(' ').toLowerCase().includes(t)||S.some(s=>s[0].toLowerCase().includes(t)&&f[4].includes(s[0]))));r.innerHTML=a.map(f=>`<article class="result"><span class="kind">${f[2]}</span><h3>${f[0]}</h3><div class="meta">${f[1]}</div><div><strong>推荐：</strong>${f[3]}</div><div class="label">附近景点</div><div class="tags">${f[4]}</div><div class="aside">出发前请通过地图核实营业状态</div></article>`).join('')||'<div class="empty">当前分类没有匹配结果</div>'}q.addEventListener('input',draw);draw()}
const SUPABASE_URL='https://sscwxmdwzyvmcytecepa.supabase.co',SUPABASE_KEY='sb_publishable_VvNJ0lfkD99lRYv-jF-SIg_HnEVY8b_';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const IDENTITY_KEY='hefei_trip_identity';
let currentIdentity=localStorage.getItem(IDENTITY_KEY)||'',editingMessageId=null,deleteMessageId=null,memoryMessages=[];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDateValue(){let d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,16)}
function formatTime(v){if(!v)return '未设置时间';return String(v).replace('T',' ').slice(0,16)}
function typeIcon(t){return t==='景点'?'📍':t==='餐饮'?'🍽️':'✦'}
function mapRow(x){return{id:String(x.id),type:x.type,to:x.author,time:String(x.message_time||'').slice(0,16),title:x.title,content:x.content,likesBy:Array.isArray(x.likes_by)?x.likes_by:[],comments:Array.isArray(x.comments)?x.comments:[]}}
async function refreshMessages(){let r=await sb.from('messages').select('*').order('message_time',{ascending:false});if(r.error){console.error(r.error);return}memoryMessages=(r.data||[]).map(mapRow);if(section==='时光留言')renderMessageCards()}
async function cloudInsert(item){let u=await sb.auth.getUser();if(!u.data.user)throw new Error('请先登录');let r=await sb.from('messages').insert({type:item.type,author:currentIdentity,message_time:item.time,title:item.title,content:item.content,likes_by:item.likesBy||[],comments:item.comments||[],user_id:u.data.user.id});if(r.error)throw r.error}
async function cloudUpdate(item){let r=await sb.from('messages').update({type:item.type,author:item.to||currentIdentity,message_time:item.time,title:item.title,content:item.content,likes_by:item.likesBy||[],comments:item.comments||[],updated_at:new Date().toISOString()}).eq('id',item.id);if(r.error)throw r.error}
async function cloudDelete(id){let r=await sb.from('messages').delete().eq('id',id);if(r.error)throw r.error}
function renderMessageCards(){let items=memoryMessages;main.innerHTML=`<div class="sync-note">云端同步已开启 · 当前身份：${esc(currentIdentity)}</div><div class="message-addbar"><button type="button" id="addMessageBtn" class="add-message-btn" aria-label="新增时光留言">＋</button></div><section aria-live="polite">${items.length?items.map(m=>`<article class="result message-card"><div class="message-head"><span class="message-type">${typeIcon(m.type)} ${esc(m.type)}</span><span class="message-type">${esc(m.to)}留言</span><div class="message-actions"><button type="button" class="icon-btn edit-message" data-id="${esc(m.id)}" title="编辑">✎</button><button type="button" class="icon-btn delete-message" data-id="${esc(m.id)}" title="删除">⌫</button></div></div><h3>${esc(m.title)}</h3><div class="message-body">${esc(m.content)}</div><div class="message-time">${esc(formatTime(m.time))}</div><div class="social-row"><button type="button" class="social-btn like-message" data-id="${esc(m.id)}">♥ ${m.likesBy.length}</button><span class="muted">${m.likesBy.length?'点赞：'+m.likesBy.map(esc).join('、'):'还没有点赞'}</span><button type="button" class="social-btn toggle-comments" data-id="${esc(m.id)}">💬 ${m.comments.length}</button></div><div class="comment-list" id="comments-${esc(m.id)}" hidden>${m.comments.map(c=>`<div class="comment-item"><div class="comment-meta"><span class="commenter">${esc(c.by)}</span> · ${esc(formatTime(c.time))} <button class="comment-delete" data-mid="${esc(m.id)}" data-cid="${esc(c.id)}">⌫</button></div><div class="comment-text">${esc(c.text)}</div></div>`).join('')}<form class="comment-form" data-id="${esc(m.id)}"><input maxlength="200" placeholder="写一条评论..." required><button class="primary">发送</button></form></div></article>`).join(''):'<div class="card"><h3>还没有留言卡片</h3><div class="muted">点击 ＋ 写下第一条旅行记忆。</div></div>'}</section>`;
 document.querySelector('#addMessageBtn').onclick=()=>openMessageEditor(null);
 document.querySelectorAll('.edit-message').forEach(b=>b.onclick=()=>openMessageEditor(b.dataset.id));
 document.querySelectorAll('.delete-message').forEach(b=>b.onclick=()=>showDeleteConfirm(b.dataset.id));
 document.querySelectorAll('.like-message').forEach(b=>b.onclick=async()=>{let m=memoryMessages.find(x=>x.id===b.dataset.id);if(!m)return;let i=m.likesBy.indexOf(currentIdentity);if(i>=0)m.likesBy.splice(i,1);else m.likesBy.push(currentIdentity);await cloudUpdate(m);await refreshMessages()});
 document.querySelectorAll('.toggle-comments').forEach(b=>b.onclick=()=>{let box=document.querySelector('#comments-'+b.dataset.id);if(box)box.hidden=!box.hidden});
 document.querySelectorAll('.comment-form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let input=f.querySelector('input'),text=input.value.trim(),m=memoryMessages.find(x=>x.id===f.dataset.id);if(!text||!m)return;m.comments.push({id:String(Date.now()),by:currentIdentity,time:localDateValue(),text});await cloudUpdate(m);await refreshMessages()});
 document.querySelectorAll('.comment-delete').forEach(b=>b.onclick=async()=>{if(!confirm('确认删除这条评论？'))return;let m=memoryMessages.find(x=>x.id===b.dataset.mid);if(!m)return;m.comments=m.comments.filter(c=>c.id!==b.dataset.cid);await cloudUpdate(m);await refreshMessages()})
}
function openMessageEditor(id){editingMessageId=id;let editing=memoryMessages.find(x=>x.id===id),wrap=document.createElement('div');wrap.className='message-editor-backdrop';wrap.innerHTML=`<div class="message-editor"><div class="editor-head"><h2>${editing?'编辑留言':'写下时光留言'}</h2><button class="close-editor" id="closeEditor">×</button></div><form id="messageForm" class="message-form"><div class="field"><label>对象类型</label><select id="mtype"><option>景点</option><option>餐饮</option><option>其他</option></select></div><div class="field"><label>留言时间</label><input id="mtime" type="datetime-local" required></div><div class="field full"><label>对象名称或标题</label><input id="mtitle" maxlength="60" required></div><div class="field full"><label>留言内容</label><textarea id="mcontent" maxlength="800" required></textarea></div><div class="form-actions"><button type="button" id="cancelEditor" class="secondary">取消</button><button class="primary">${editing?'保存修改':'发布留言'}</button></div></form></div>`;document.body.appendChild(wrap);let type=wrap.querySelector('#mtype'),time=wrap.querySelector('#mtime'),title=wrap.querySelector('#mtitle'),content=wrap.querySelector('#mcontent');if(editing){type.value=editing.type;time.value=editing.time;title.value=editing.title;content.value=editing.content}else time.value=localDateValue();let close=()=>wrap.remove();wrap.querySelector('#closeEditor').onclick=close;wrap.querySelector('#cancelEditor').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()};wrap.querySelector('#messageForm').onsubmit=async e=>{e.preventDefault();let item={id:editingMessageId,type:type.value,to:currentIdentity,time:time.value,title:title.value.trim(),content:content.value.trim(),likesBy:editing?editing.likesBy:[],comments:editing?editing.comments:[]};try{if(editing)await cloudUpdate(item);else await cloudInsert(item);close();editingMessageId=null;await refreshMessages()}catch(err){alert('保存失败：'+err.message)}};title.focus()}
function showDeleteConfirm(id){deleteMessageId=id;if(!confirm('确认删除这条留言？删除后无法恢复。'))return;cloudDelete(id).then(refreshMessages).catch(e=>alert('删除失败：'+e.message))}
async function initAuth(){let sess=await sb.auth.getSession();if(!sess.data.session){document.querySelector('#authMask').style.display='grid';return}if(!currentIdentity){document.querySelector('#loginStep').hidden=true;document.querySelector('#identityStep').hidden=false;return}document.querySelector('#authMask').style.display='none';document.querySelector('#sessionUser').textContent='当前身份：'+currentIdentity;await refreshMessages();sb.channel('trip-messages').on('postgres_changes',{event:'*',schema:'public',table:'messages'},refreshMessages).subscribe()}
function render(){renderSub();if(section==='日程')renderSchedule();else if(section==='景点库')renderSpots();else if(section==='美食库')renderFood();else renderMessages()}
renderTop();render();
document.querySelector('#loginBtn').onclick=async()=>{let email=document.querySelector('#loginEmail').value.trim(),password=document.querySelector('#loginPassword').value,r=await sb.auth.signInWithPassword({email,password});if(r.error){document.querySelector('#loginStatus').textContent='登录失败：'+r.error.message;return}document.querySelector('#loginStep').hidden=true;document.querySelector('#identityStep').hidden=false};
document.querySelectorAll('#identityStep button').forEach(b=>b.onclick=()=>{currentIdentity=b.dataset.user;localStorage.setItem(IDENTITY_KEY,currentIdentity);location.reload()});
document.querySelector('#changeIdentity').onclick=()=>{localStorage.removeItem(IDENTITY_KEY);location.reload()};
document.querySelector('#logoutBtn').onclick=async()=>{await sb.auth.signOut();localStorage.removeItem(IDENTITY_KEY);location.reload()};initAuth();
</script></body></html>
